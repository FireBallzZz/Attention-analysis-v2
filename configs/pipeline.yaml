fps: 10
image_size: [640, 640]
device: auto  # auto | cpu | cuda

detect:
  weights: yolo11n-pose.pt
  person_weights: ""  # Disabled person-box fallback to eliminate phantom detections on walls/legs
  conf: 0.20
  iou: 0.45
  imgsz: 1920
  tiles: false
  min_det_conf: 0.20
  require_face: false
  max_students: null  # Set to fixed integer e.g. 6, or null for auto-calibration

track:
  max_age: 30
  n_init: 3
  max_iou_distance: 0.7
  smooth_box: true           # Anti-jitter temporal box smoothing
  box_ema_alpha: 0.7         # Current box weight (0.7 current + 0.3 previous)
  max_area_ratio: 1.5        # Max area expansion ratio before damping sudden spikes
  auto_max_students: false   # Disabled artificial capacity capping so full multi-row classrooms (30-40+ students) are not truncated

face:
  backend: openseeface  # openseeface | mediapipe | stub
  min_face_px: 20

# Dataset / weight locations (relative to project root).
# FER2013 and RAF-DB are not used.
data:
  scb_root: data/raw/scb/SCB5-Handrise-Read-write/SCB5-Handrise-Read-write-2024-9-17
  scb_yaml: data/raw/scb/SCB5-Handrise-Read-write/SCB5-Handrise-Read-write-2024-9-17/scb.yaml
  daisee_root: data/raw/daisee
  l2cs_repo: third_party/L2CS-Net
  scb_repo: third_party/SCB-dataset

models:
  gaze_weights: checkpoints/l2cs_finetuned.pt
  posture_weights: checkpoints/posture_scb.pt
  scb_weights: checkpoints/scb_yolo.pt
  manual_binary_weights: checkpoints/classroom_manual_binary_unquarantined.pt
  fusion_weights: checkpoints/classroom_manual_binary_unquarantined.pt
  fusion_daisee_base: checkpoints/baseline/fusion_daisee.pt

scb:
  conf: 0.45
  match_iou: 0.45
  blend: 0.50
  # SCB-dataset3 classes: hand-raising, reading, writing,
  # using-phone, bowing-head, leaning-over-table

fusion:
  feat_dim: 32
  hidden: 64
  window: 16
  score_min: 0.0
  score_max: 100.0
  binary_threshold: 0.50  # Tuned Champion Model: Focal Loss (gamma=2.0, alpha=0.45) achieving 87.74% Val Acc


drop:
  low_threshold: 40.0
  sustain_seconds: 3.0
  sudden_delta: 20.0
  sudden_seconds: 2.0
  cooldown_seconds: 8.0
  ema_alpha: 0.3

llm:
  enabled: false
  provider: openai
  model: gpt-4o-mini
  temperature: 0.2

viz:
  high: 70.0
  moderate_low: 40.0
  out_video: runs/attention_overlay.mp4
  # Overlay bands come from the classroom rubric (posture / face / actions),
  # not from these cutoffs alone. Cutoffs still label the fusion score if trained.
